[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-detection"
version = "1.0.0"
description = "Four-layer CNN, indexed image datasets, and a leaf disease prediction workspace."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pranjal"}]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=1.26,<3",
  "Pillow>=11,<13",
  "streamlit>=1.55,<2",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:plant_disease.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
